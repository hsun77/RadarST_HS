[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "radarst"
version = "0.1.0"
description = "Post-clustering refinement for spatial transcriptomics"
readme = "README.md"
requires-python = ">=3.10,<3.11"
license = "MIT"
authors = [{name = "RadarST contributors"}]
dependencies = [
  "numpy==1.26.4", "pandas==2.3.3", "scipy==1.15.2",
  "scikit-learn==1.7.2", "scanpy==1.11.5", "anndata==0.11.4",
  "h5py==3.14.0", "pyarrow==24.0.0", "joblib==1.5.3",
  "numba==0.65.1", "threadpoolctl==3.6.0", "PyYAML>=6,<7"
]

[project.optional-dependencies]
test = ["pytest>=8,<9"]

[project.scripts]
radarst = "radarst.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
radarst = ["teacher_protocol.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
